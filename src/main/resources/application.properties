# Load environment variables from .env file if it exists
spring.config.import=optional:file:.env[.properties]

# Exclude MongoDB Atlas Vector Store auto-configuration if not needed
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.mongodb.autoconfigure.MongoDBAtlasVectorStoreAutoConfiguration

# MongoDB Atlas connection
spring.data.mongodb.uri=${MONGO_URI}

# Server configuration
server.port=${SERVER_PORT}

# Cache configuration
spring.cache.type=simple

# Custom configuration
url-shortener.allowed-characters=0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
url-shortener.key-length=7
url-shortener.base-url=${BASE_URL}
